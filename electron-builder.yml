appId: app.cvgen.desktop
productName: CV GEN
copyright: CV GEN
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  # IA locale : seul le moteur processeur (win-x64) est livré ; variantes GPU et sources de llama.cpp exclues.
  - "!node_modules/@node-llama-cpp/win-x64-cuda/**"
  - "!node_modules/@node-llama-cpp/win-x64-cuda-ext/**"
  - "!node_modules/@node-llama-cpp/win-x64-vulkan/**"
  - "!node_modules/@node-llama-cpp/win-arm64/**"
  - "!node_modules/node-llama-cpp/llama/gitRelease.bundle"
  - "!node_modules/node-llama-cpp/templates/**"
# Extension navigateur « CV GEN · Offres » : dossier à charger dans Chrome ou Edge (Paramètres › Extension LinkedIn).
extraResources:
  - from: extension
    to: extension
asarUnpack:
  - resources/**
  # Bibliothèques natives : chargées depuis le disque, hors de l'archive asar.
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: CV-GEN-${version}-${arch}.${ext}
portable:
  artifactName: CV-GEN-${version}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CV GEN
  artifactName: CV-GEN-Setup-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: lburdier
  repo: cv-gen
  releaseType: release
