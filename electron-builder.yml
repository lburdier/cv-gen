appId: app.cvgen.desktop
productName: CV GEN
copyright: CV GEN
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: CV-GEN-${version}-${arch}.${ext}
portable:
  artifactName: CV-GEN-${version}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: CV GEN
  artifactName: CV-GEN-Setup-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: lburdier
  repo: cv-gen
  releaseType: release
